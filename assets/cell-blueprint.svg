<svg width="1080" height="720" viewBox="0 0 1080 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Техническая схема комплекса АКС БПЛА: вид спереди и вид сбоку, габариты 1300x1800x2000 мм, манипулятор DOBOT, магазины заготовок, система технического зрения">
  <defs>
