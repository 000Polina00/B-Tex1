<svg width="640" height="460" viewBox="0 0 640 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Роботизированная ячейка в изометрии: манипулятор DOBOT, магазины оснастки и система технического зрения">
  <defs>
    <pattern id="bcGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2fe3c4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="460" fill="url(#bcGrid)"/>
  <ellipse cx="320" cy="420" rx="238" ry="26" fill="#2fe3c4" fill-opacity="0.06"/>

  <!-- корпус ячейки (изометрия) -->
  <polygon points="110,170 430,170 520,120 200,120" fill="#0e1c26" stroke="#2fe3c4" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="430,170 520,120 520,360 430,410" fill="#0a1620" stroke="#2fe3c4" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="110" y="170" width="320" height="240" fill="#0b1a22" stroke="#2fe3c4" stroke-opacity="0.5" stroke-width="2"/>

  <!-- крыша: вентиляционный блок -->
  <ellipse cx="315" cy="145" rx="34" ry="16" fill="#0e2129" stroke="#1f4453" stroke-width="1.5"/>
  <ellipse cx="315" cy="145" rx="19" ry="9" fill="none" stroke="#1f4453" stroke-width="1.5"/>
  <g stroke="#1f4453" stroke-width="2" stroke-linecap="round">
    <path d="M218 152H266"/>
    <path d="M218 162H248"/>
    <path d="M370 152H418"/>
  </g>

  <!-- окно с внутренней зоной -->
  <rect x="140" y="196" width="260" height="184" rx="4" fill="#08141c" stroke="#1f4453" stroke-width="1.5"/>
  <path d="M414 180V400" stroke="#1f4453" stroke-width="1.5" stroke-dasharray="5 6"/>
  <circle cx="412" cy="186" r="4" fill="#2fe3c4"/>
  <circle cx="398" cy="186" r="4" fill="#1f4453"/>

  <!-- магазины -->
  <rect x="152" y="206" width="26" height="76" rx="3" fill="#0e2129" stroke="#1f4453" stroke-width="1.5"/>
  <rect x="156" y="213" width="18" height="10" rx="2" fill="#16303b"/>
  <rect x="156" y="230" width="18" height="10" rx="2" fill="#16303b"/>
  <rect x="156" y="247" width="18" height="10" rx="2" fill="#16303b"/>
  <rect x="344" y="206" width="44" height="104" rx="3" fill="#0e2129" stroke="#1f4453" stroke-width="1.5"/>
  <rect x="350" y="214" width="32" height="13" rx="2" fill="#16303b"/>
  <rect x="350" y="235" width="32" height="13" rx="2" fill="#16303b"/>
  <rect x="350" y="256" width="32" height="13" rx="2" fill="#16303b"/>
  <rect x="350" y="277" width="32" height="13" rx="2" fill="#16303b"/>

  <!-- система технического зрения -->
  <rect x="262" y="206" width="26" height="14" rx="3" fill="#123243" stroke="#2fe3c4" stroke-opacity="0.7" stroke-width="1.5"/>
  <circle cx="275" cy="224" r="4" fill="#08141c" stroke="#2fe3c4" stroke-width="1.5"/>
  <path d="M268 228L242 342H312L283 228Z" fill="#2fe3c4" fill-opacity="0.07" stroke="#2fe3c4" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- стол сборки -->
  <rect x="152" y="344" width="236" height="8" rx="2" fill="#123243" stroke="#1f4453" stroke-width="1.5"/>
  <rect x="164" y="352" width="7" height="24" fill="#16303b"/>
  <rect x="368" y="352" width="7" height="24" fill="#16303b"/>

  <!-- манипулятор DOBOT -->
  <rect x="168" y="306" width="28" height="38" rx="3" fill="#123243" stroke="#2fe3c4" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M182 306L210 246L256 268L270 318" fill="none" stroke="#cfe9ef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="182" cy="306" r="5" fill="#0b1a22" stroke="#2fe3c4" stroke-width="1.5"/>
  <circle cx="210" cy="246" r="5" fill="#0b1a22" stroke="#2fe3c4" stroke-width="1.5"/>
  <circle cx="256" cy="268" r="4" fill="#0b1a22" stroke="#2fe3c4" stroke-width="1.5"/>
  <path d="M264 318L270 326L276 318" fill="none" stroke="#2fe3c4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- квадрокоптер на столе -->
  <rect x="252" y="324" width="44" height="20" rx="5" fill="#e9f3f8"/>
  <path d="M252 334H222M296 334H326" stroke="#cfe9ef" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="222" cy="330" rx="15" ry="4" fill="#9fc6d2" fill-opacity="0.5"/>
  <ellipse cx="326" cy="330" rx="15" ry="4" fill="#9fc6d2" fill-opacity="0.5"/>
  <path d="M262 344V352M286 344V352M257 352H291" stroke="#cfe9ef" stroke-width="2.5" stroke-linecap="round"/>

  <!-- строка состояния -->
  <rect x="140" y="388" width="260" height="16" rx="4" fill="#0e2129" stroke="#1f4453" stroke-width="1.5"/>
  <circle cx="154" cy="396" r="4" fill="#2fe3c4"/>
  <circle cx="170" cy="396" r="4" fill="#1f4453"/>
  <rect x="188" y="393" width="90" height="6" rx="3" fill="#2fe3c4" fill-opacity="0.6"/>
  <!-- ================= ВЫНОСКИ И ХАРАКТЕРИСТИКИ ================= -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <path d="M10 90H64L196 276" fill="none" stroke="#4cc7ff" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="196" cy="276" r="3" fill="#4cc7ff"/>
    <text x="10" y="64" font-size="10" fill="#cfe9ef">МАНИПУЛЯТОР</text>
    <text x="10" y="78" font-size="10" fill="#7f9aab">DOBOT, 6 ОСЕЙ</text>

    <text x="296" y="216" font-size="9" fill="#cfe9ef">МАГАЗИНЫ</text>
    <text x="296" y="228" font-size="9" fill="#7f9aab">ОСНАСТКИ</text>

    <g>
      <rect x="528" y="180" width="104" height="26" rx="6" fill="#0e1c26" stroke="#2fe3c4" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="528" y="214" width="104" height="26" rx="6" fill="#0e1c26" stroke="#2fe3c4" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="528" y="248" width="104" height="26" rx="6" fill="#0e1c26" stroke="#2fe3c4" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="540" y="197" font-size="10" fill="#cfe9ef">6 ОСЕЙ</text>
      <text x="540" y="231" font-size="10" fill="#cfe9ef">2 ЗАХВАТА</text>
      <text x="540" y="265" font-size="10" fill="#cfe9ef">ЗРЕНИЕ 100%</text>
    </g>

    <!-- габариты -->
    <g stroke="#4cc7ff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 5">
      <path d="M110 412V436M430 412V436"/>
    </g>
    <path d="M110 430H430" stroke="#4cc7ff" stroke-opacity="0.75" stroke-width="1.5"/>
    <g fill="#4cc7ff" fill-opacity="0.85">
      <polygon points="110,430 122,425 122,435"/>
      <polygon points="430,430 418,425 418,435"/>
    </g>
    <text x="270" y="424" font-size="11" fill="#cfe9ef" text-anchor="middle">1300×1800×2000 мм</text>
  </g>
</svg>

